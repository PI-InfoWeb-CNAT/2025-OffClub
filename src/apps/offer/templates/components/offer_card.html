{% load static %}

<div class="{{class}} offer_card">
    <div class="offer_card_enterprise">
        {% if enterprise_image %}
            <img src="{{ enterprise_image }}" alt="">
        {% else %}
            <img src="{% static 'imgs/empty_enterprise.svg' %}" alt="">
        {% endif %}
        <p>{{ enterprise_name }}</p>
    </div>
    <div class="offer_card_offer">
        <img src="{{ offer_image }}" alt="" class="offer_image">
        <span>{{ discount }}%</span>
        <h3><a href="{{link}}">{{ title }}</a></h3>
    </div>
    <div class="price">
        <p class="currency">R$</p>
        <p class="promotion_price">{{ final_price }}</p>
        <p class="old_price">{{ old_price }}</p>
    </div>
    <div class="offer_card_coupon">
        <p class="general">Até {{ end_date }}</p>
    </div>
</div>
