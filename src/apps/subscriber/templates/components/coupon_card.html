{% load static %}

<div class="{{ class }} coupon_card">
    <div class="coupon_card_enterprise">
        <img src="{{ enterprise_image }}" alt="">
        <p>{{ enterprise_name }}</p>
    </div>
    <div class="price">
        <p class="currency">R$</p>
        <p class="promotion_price">{{ final_price|floatformat:2 }}</p>
        <p class="old_price">{{ old_price|floatformat:2 }}</p>
    </div>
    <div class="coupon_card_coupon">
        <p class="general">Disponível até {{ end_date }}</p>
    </div>

    {% for dic in used_coupons %}
        {% with coupon=dic.object %}
            <div class="coupon-card">
                <button class="evaluate_button open_modal" data-coupon-id="{{ coupon.object.id }}">Avaliar</button>
                
                {% include 'components/evaluate_coupon.html' with coupon=coupon %}
            </div>
        {% endwith %}
    {% endfor %}
</div>
